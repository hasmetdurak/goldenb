version: "3.9"

# GoldenBet AI - Lokal Docker Compose (Dokploy referansı)
# Çalıştırmak için: docker compose up --build

services:
  goldenb:
    build:
      context: .
      dockerfile: Dockerfile
    image: goldenb:0.1.0
    container_name: goldenb
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Redis'e GEREK YOK (MVP stateless)
    # Dış API'lere çıkış gerekir (NBA stats + EuroLeague)
    networks:
      - goldenb-net

networks:
  goldenb-net:
    driver: bridge
